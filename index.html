<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maç Sim">
<meta name="theme-color" content="#0e1410">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Oran Bazlı Maç Simülatörü</title>
<style>
:root{--bg:#0e1410;--card:#18211b;--tx:#f2f5f2;--mu:#9aa89d;--ac:#2ecc71}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
.hdr{display:flex;align-items:center;gap:6px;background:#171a2e;border-radius:12px;padding:6px 8px}
.tm{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:6px}
.tm.r{justify-content:flex-end;text-align:right}
.tm>div{min-width:0}
.tm b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm small{font-size:10px;color:var(--mu)}
.mid{text-align:center;flex:none;padding:0 4px}
#sc,.sc{font-size:26px;font-weight:800;letter-spacing:2px;white-space:nowrap;line-height:1}
#clk{font-size:12px;font-weight:700;color:var(--ac);margin-top:3px}
#tk{font-size:12px;color:var(--mu);height:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center}
#wrap{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;display:block}
.pb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.bar{flex:1;height:9px;border-radius:5px;overflow:hidden;display:flex;background:#222}
.bar div{height:100%;transition:width .3s}
.btns{display:flex;gap:6px}
button{width:100%;padding:12px 6px;border:0;border-radius:10px;background:var(--ac);color:#04210f;font-weight:700;font-size:15px}
button.sec{background:#2c3a2f;color:var(--tx)}
.btns #sp{flex:none;width:58px}
.btns #go{flex:1.4}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 16px)}
#sheet.show{display:block}
#sheet .in{max-width:480px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
input[type=text],input[type=number],input[type=date]{width:100%;padding:9px;border-radius:8px;border:1px solid #2c3a2f;background:#0e1410;color:var(--tx);font-size:15px;color-scheme:dark}
input[type=color]{width:100%;height:34px;border:0;border-radius:8px;background:none;padding:0}
.ml{max-height:300px;overflow:auto;margin-top:8px}
.mi{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;background:#0e1410;margin-bottom:6px;cursor:pointer}
.mi:active{background:#22301f}
.mi .tm2{font-size:12px;color:var(--mu);width:38px;flex:none}
.mi .nm{flex:1;min-width:0;font-size:14px;font-weight:600}
.mi .nm small{display:block;color:var(--mu);font-weight:400;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .od{font-size:12px;color:var(--ac);white-space:nowrap}
.mm{font-size:13px;color:var(--mu);padding:6px 0}
#end{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#end.show{display:flex}
#end .box{width:100%;max-width:400px;text-align:center}
#end .res{font-size:22px;font-weight:800;margin:14px 0 4px}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="tm"><span id="lA"></span><div><b id="tA"></b><small id="sA"></small></div></div>
    <div class="mid"><div id="sc">0 : 0</div><div id="clk">0’</div></div>
    <div class="tm r"><div><b id="tB"></b><small id="sB"></small></div><span id="lB"></span></div>
  </div>
  <div id="tk">Maçı başlatmak için ▶ düğmesine bas</div>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <div class="pb"><span id="pa">%0</span><div class="bar"><div id="ba"></div><div id="bb"></div></div><span id="pb">%0</span></div>
  <div class="btns"><button class="sec" id="op">📋 Maç / Ayarlar</button><button id="go">▶ Başlat</button><button class="sec" id="sp">1x</button></div>
</div>

<div id="sheet"><div class="in">
  <div class="card" id="mcard">
    <div style="font-weight:700;margin-bottom:8px">📅 Günün Maçları</div>
    <div class="row">
      <div><label>Tarih</label><input type="date" id="md"></div>
      <div><label>Ara (takım / lig)</label><input type="text" id="mf" placeholder="örn. Süper Lig"></div>
    </div>
    <button id="mb" style="margin-top:8px">Maçları Getir</button>
    <label style="margin-top:8px;display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="hf" checked style="width:auto;margin:0"> Biten maçları gizle</label>
    <label style="margin-top:6px;display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="ho" style="width:auto;margin:0"> Sadece oranı olan maçlar</label>
    <div class="mm" id="mn"></div>
    <div id="ml" class="ml"></div>
    <details style="margin-top:8px"><summary style="font-size:12px;color:var(--mu)">Ayarlar</summary>
      <label style="margin-top:6px">Worker adresi</label>
      <input type="text" id="wu" placeholder="https://xxxx.workers.dev"></details>
  </div>
  <div class="card" id="setup">
    <div style="font-weight:700;margin-bottom:8px">⚙️ Takımlar ve Oranlar</div>
    <div class="row">
      <div><label>Ev sahibi (A) – üst kale</label><input type="text" id="nA" value="Fenerbahçe"></div>
      <div><label>Deplasman (B) – alt kale</label><input type="text" id="nB" value="Liverpool"></div>
      <div><label>A iddaa oranı</label><input type="number" id="oA" value="1.06" step="0.01" min="1.01"></div>
      <div><label>B iddaa oranı</label><input type="number" id="oB" value="8.90" step="0.01" min="1.01"></div>
      <div><label>A rengi</label><input type="color" id="cA" value="#1b2a8f"></div>
      <div><label>B rengi</label><input type="color" id="cB" value="#d9202a"></div>
    </div>
    <div style="margin-top:8px"><label>Beraberlik oranı (isteğe bağlı)</label><input type="number" id="oD" value="" step="0.01" min="1.01" placeholder="örn. 5.00"></div>
    <div id="chn" style="font-size:12px;color:var(--mu);margin-top:8px"></div>
  </div>
  <button id="cl">Tamam</button>
</div></div>

<div id="end"><div class="box"><div class="hdr" style="padding:14px 12px"><div class="tm"><span id="eA"></span><div><b id="enA"></b></div></div><div class="mid"><div class="sc" id="eS"></div></div><div class="tm r"><div><b id="enB"></b></div><span id="eB"></span></div></div><div class="res" id="eR"></div><button id="eC" style="margin-top:8px">Kapat</button></div></div>
<canvas id="cf"></canvas>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let W=360,H=560,st=null,raf=null,speed=1;
const SPEEDS=[1,2,3,5];

/* ---- Oran modeli ---- */
function model(){
  const oA=Math.max(1.01,+$('oA').value||2),oB=Math.max(1.01,+$('oB').value||2);
  const a=1/oA,b=1/oB,pa=a/(a+b),pb=1-pa;
  return {pa,pb,atkA:0.5+0.6*(pa-0.5),convA:0.10+0.45*pa,convB:0.10+0.45*pb};
}
function planAttacks(){
  const m=model(),d=Math.abs(m.pa-m.pb),mean=7+6*d;
  const g=(Math.random()+Math.random()+Math.random()-1.5)*8;
  const n=Math.max(3,Math.min(15,Math.round(mean+g)));
  const t=[];for(let i=0;i<n;i++)t.push(2+Math.random()*86);
  return t.sort((a,b)=>a-b);
}
function badge(k,s){
  const n=$(k==='A'?'nA':'nB').value||'?',c=$(k==='A'?'cA':'cB').value;
  return '<span style="display:inline-flex;flex:none;width:'+s+'px;height:'+s+'px;border-radius:50%;background:'+c+';border:2px solid #fff;align-items:center;justify-content:center;font-size:'+Math.round(s*.36)+'px;font-weight:800;color:#fff">'+n.slice(0,3).toUpperCase()+'</span>';
}
function setSides(){
  const topA=!(st&&st.htDone);
  $('sA').textContent=topA?'⬆ üstte':'⬇ altta';
  $('sB').textContent=topA?'⬇ altta':'⬆ üstte';
}
function refreshInfo(){
  const m=model(),nA=$('nA').value,nB=$('nB').value;
  $('tA').textContent=nA;$('tB').textContent=nB;
  $('lA').innerHTML=badge('A',34);$('lB').innerHTML=badge('B',34);
  $('pa').textContent='%'+Math.round(m.pa*100);$('pb').textContent='%'+Math.round(m.pb*100);
  $('ba').style.width=m.pa*100+'%';$('bb').style.width=m.pb*100+'%';
  $('ba').style.background=$('cA').value;$('bb').style.background=$('cB').value;
  $('chn').textContent='Atak sonu gol şansı: '+nA+' %'+Math.round(m.convA*100)+' · '+nB+' %'+Math.round(m.convB*100);
  setSides();if(!raf)scene(0,0);
}
['nA','nB','oA','oB','oD','cA','cB'].forEach(i=>$(i).addEventListener('input',refreshInfo));

/* ---- Çizim ---- */
function fit(){
  const r=$('wrap').getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));
  ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;if(!raf)scene(0,0);
}
addEventListener('resize',fit);
const GG=()=>H*0.035;
function scene(shT,shB){
  ctx.fillStyle='#2e8b3a';ctx.fillRect(0,0,W,H);
  for(let i=1;i<14;i+=2){ctx.fillStyle='rgba(255,255,255,.04)';ctx.fillRect(0,i*H/14,W,H/14);}
  ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=2.5;
  ctx.strokeRect(3,3,W-6,H-6);
  ctx.beginPath();ctx.moveTo(3,H/2);ctx.lineTo(W-3,H/2);ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,H/2,W*.14,0,7);ctx.stroke();
  const pw=W*.62,ph=H*.16,sw=W*.34,sh=H*.07;
  for(const top of [true,false]){
    ctx.strokeRect((W-pw)/2,top?3:H-3-ph,pw,ph);
    ctx.strokeRect((W-sw)/2,top?3:H-3-sh,sw,sh);
    ctx.beginPath();ctx.arc(W/2,top?ph+3:H-ph-3,W*.1,top?0:Math.PI,top?Math.PI:2*Math.PI);ctx.stroke();
  }
  goal(true,shT);goal(false,shB);
  const topK=st&&st.htDone?'B':'A',botK=topK==='A'?'B':'A';
  keeper(W/2,ph*.62,topK);keeper(W/2,H-ph*.62,botK);
}
function goal(top,shake){
  const gw=W*.28,gh=GG(),x=(W-gw)/2,y=top?3:H-3-gh;
  ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(x,y,gw,gh);
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;
  for(let i=0;i<=gw;i+=7){ctx.beginPath();ctx.moveTo(x+i+(shake?Math.sin(i+shake)*3:0),y);ctx.lineTo(x+i,y+gh);ctx.stroke();}
  ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(x,y,gw,gh);
}
function disc(x,y,col,txt,r,alpha){
  ctx.globalAlpha=alpha||1;
  ctx.beginPath();ctx.arc(x,y,Math.max(1,r),0,7);ctx.fillStyle=col;ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold '+Math.round(r*.6)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(txt.slice(0,3).toUpperCase(),x,y);ctx.globalAlpha=1;
}
function keeper(x,y,k){disc(x,y,$(k==='A'?'cA':'cB').value,$(k==='A'?'nA':'nB').value||'?',W*.045,.85);}
function bigText(t,sz,y){
  ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=8;
  ctx.font='bold '+sz+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,W/2,y);ctx.shadowBlur=0;
}

/* ---- Atak ---- */
function newAttack(){
  const m=model(),team=Math.random()<m.atkA?'A':'B';
  const conv=team==='A'?m.convA:m.convB,r=Math.random();
  const out=r<conv?'goal':(r<conv+(1-conv)*.55?'save':'miss');
  const topTeam=st.htDone?'B':'A';
  const goalTop=team!==topTeam;               // üstteki takımın rakibi üst kaleye atar
  const sx=W*(.2+Math.random()*.6),sy=H*(goalTop?.5+Math.random()*.12:.38+Math.random()*.12);
  const ty=goalTop?3+GG()*.5:H-3-GG()*.5;
  const tx=out==='miss'?W/2+(Math.random()<.5?-1:1)*W*.22:W/2+(Math.random()-.5)*W*.2;
  st.atk={team,out,goalTop,t:0,sx,sy,tx,ty,cx:(sx+tx)/2+(Math.random()-.5)*W*.5,cy:(sy+ty)/2,minute:Math.floor(st.min)};
}
function pt(a,t){const u=1-t;return[u*u*a.sx+2*u*t*a.cx+t*t*a.tx,u*u*a.sy+2*u*t*a.cy+t*t*a.ty];}
function tick(t){$('tk').innerHTML=t;}
function resolve(a){
  const nm=a.team==='A'?$('nA').value:$('nB').value;
  if(a.out==='goal'){st.s[a.team]++;$('sc').textContent=st.s.A+' : '+st.s.B;tick('<b style="color:#fff">'+a.minute+'’ GOL! '+nm+'</b>');}
  else tick(a.minute+'’ '+nm+(a.out==='save'?' – kaleci kurtardı':' – şut dışarı'));
}

function loop(ts){
  if(!st)return;
  const dt=Math.min(50,ts-(st.last||ts));st.last=ts;
  if(st.htT>0){st.htT-=dt/1000;}
  else if(!st.over&&!st.atk){
    st.min+=dt/1000*1.6*speed;
    const nx=st.sched[st.i];
    if(nx!==undefined&&(nx<45||st.htDone)&&st.min>=nx){st.min=nx;st.i++;newAttack();}
    else if(!st.htDone&&st.min>=45){st.min=45;st.htDone=true;st.htT=2.2;setSides();tick('Devre arası – takımlar yer değiştirdi ⇄');}
    else if(nx===undefined&&st.min>=90){st.min=90;st.over=true;endMatch();}
  }
  $('clk').textContent=Math.floor(st.min)+'’';
  let shT=0,shB=0;const a=st.atk;let fxT=null;
  if(a){
    a.t+=dt/1000*0.7*speed;
    if(a.t>=1){
      if(!a.done){a.done=true;a.fx=0;resolve(a);}
      a.fx+=dt/1000;
      if(a.out==='goal'){if(a.goalTop)shT=a.fx*40;else shB=a.fx*40;}
      if(a.fx>1.3){st.atk=null;}
    }
  }
  scene(shT,shB);
  if(a&&st.atk){
    const col=$(a.team==='A'?'cA':'cB').value,nm=$(a.team==='A'?'nA':'nB').value,R=W*.06;
    if(a.t<1){const [x,y]=pt(a,a.t);disc(x,y,col,nm,R);}
    else{
      const [x,y]=pt(a,1),dir=a.goalTop?1:-1;
      if(a.out==='goal'){disc(x,y,col,nm,R*Math.max(.3,1-a.fx*.5));bigText('GOL!',Math.round(W*.16),H/2);}
      else{
        const dx=a.out==='save'?(x-W/2)*1.2:(x>W/2?60:-60);
        disc(x+dx*a.fx*2,y+dir*a.fx*H*.2,col,nm,R);
        bigText(a.out==='save'?'KURTARIŞ':'DIŞARI',Math.round(W*.08),H/2);
      }
    }
  }
  if(st.htT>0){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H/2-44,W,88);
    bigText('DEVRE ARASI',Math.round(W*.075),H/2-12);
    ctx.fillStyle='#fff';ctx.font=Math.round(W*.04)+'px system-ui';ctx.fillText('⇄ Takımlar yer değiştirdi',W/2,H/2+18);
  }
  raf=requestAnimationFrame(loop);
}

/* ---- Başlat / bitir ---- */
function start(){
  if(raf)cancelAnimationFrame(raf);
  closeSheet();hideEnd();
  st={min:0,s:{A:0,B:0},atk:null,over:false,i:0,htDone:false,htT:0,sched:planAttacks()};
  $('sc').textContent='0 : 0';$('clk').textContent='0’';tick('Maç başladı!');
  $('go').textContent='⟳ Yeniden';setSides();refreshInfoBadges();
  raf=requestAnimationFrame(loop);
}
function refreshInfoBadges(){$('lA').innerHTML=badge('A',34);$('lB').innerHTML=badge('B',34);}
function endMatch(){
  const A=st.s.A,B=st.s.B,nA=$('nA').value,nB=$('nB').value;
  tick('Maç bitti: '+A+' - '+B+' ('+st.sched.length+' atak)');
  $('enA').textContent=nA;$('enB').textContent=nB;$('eS').textContent=A+' : '+B;
  $('eA').innerHTML=badge('A',40);$('eB').innerHTML=badge('B',40);
  $('eR').textContent=A>B?'🏆 '+nA+' kazandı!':B>A?'🏆 '+nB+' kazandı!':'🤝 Maç berabere bitti';
  $('end').classList.add('show');
  confetti(A>B?[$('cA').value]:B>A?[$('cB').value]:[$('cA').value,$('cB').value]);
}
function hideEnd(){$('end').classList.remove('show');}
$('eC').onclick=hideEnd;
$('go').onclick=start;
$('sp').onclick=()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];$('sp').textContent=speed+'x';};
function closeSheet(){$('sheet').classList.remove('show');}
$('op').onclick=()=>$('sheet').classList.add('show');
$('cl').onclick=()=>{closeSheet();refreshInfo();};

let cfRaf=null;
function confetti(cols){
  const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const pal=cols.concat(['#ffd54a','#ffffff','#2ecc71','#ff6b6b']),ps=[],W2=c.width,H2=c.height;let late=true;
  function burst(ox,oy,n){for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2.2,v=8+Math.random()*12;
    ps.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:pal[Math.floor(Math.random()*pal.length)]});}}
  burst(W2*.15,H2*.8,90);burst(W2*.85,H2*.8,90);burst(W2*.5,H2*.55,110);
  setTimeout(()=>{burst(W2*.3,H2*.7,70);burst(W2*.7,H2*.7,70);late=false;},600);
  if(cfRaf)cancelAnimationFrame(cfRaf);
  (function f(){
    x.clearRect(0,0,W2,H2);
    for(const p of ps){p.vy+=.28;p.vx*=.992;p.vy*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();}
    for(let i=ps.length-1;i>=0;i--)if(ps[i].y>H2+30)ps.splice(i,1);
    if(ps.length||late)cfRaf=requestAnimationFrame(f);else x.clearRect(0,0,W2,H2);
  })();
}

/* ---- Günün maçları (Worker üzerinden) ---- */
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let MM=[];
$('wu').value=store('wu')||'';
$('md').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
function renderM(){
  const q=$('mf').value.trim().toLocaleLowerCase('tr');
  const FIN=['FT','AET','PEN','CANC','PST','ABD','AWD','WO'],LIVE=['1H','HT','2H','ET','BT','P','LIVE','INT'];
  const hide=$('hf').checked;
  const list=MM.filter(m=>(!hide||!FIN.includes(m.status))&&(!$('ho').checked||m.odds)&&(!q||(m.home+' '+m.away+' '+m.league+' '+m.country).toLocaleLowerCase('tr').includes(q)));
  $('ml').innerHTML=list.length?list.map(m=>'<div class="mi" data-id="'+esc(m.id)+'"><span class="tm2">'+esc(m.time)+(LIVE.includes(m.status)?'<br>🔴':FIN.includes(m.status)?'<br>✓':'')+'</span><span class="nm">'+esc(m.home)+' - '+esc(m.away)+'<small>'+esc(m.country)+' · '+esc(m.league)+'</small></span><span class="od">'+(m.odds?m.odds.h+' / '+(m.odds.d||'-')+' / '+m.odds.a:'<i style="color:var(--mu)">oran yok</i>')+'</span></div>').join(''):'<div class="mm">Maç bulunamadı (biten maçlar gizli olabilir).</div>';
}
async function loadM(){
  const base=$('wu').value.trim().replace(/\/$/,'');
  if(!base){$('ml').innerHTML='<div class="mm">Önce "Ayarlar" bölümüne Worker adresini gir.</div>';return;}
  store('wu',base);
  $('ml').innerHTML='<div class="mm">Yükleniyor…</div>';
  try{
    const r=await fetch(base+'/?date='+$('md').value),d=await r.json();
    if(d.error){$('ml').innerHTML='<div class="mm">Hata: '+esc(typeof d.error==='string'?d.error:JSON.stringify(d.error))+'</div>';return;}
    MM=d.matches||[];
    $('mn').textContent=d.note||(MM.length?MM.length+' maç, '+(d.withOdds||0)+' tanesinde oran var.':'');
    if(!MM.length){$('ml').innerHTML='<div class="mm">Bu tarihte maç bulunamadı.</div>';return;}
    renderM();
  }catch(e){$('ml').innerHTML='<div class="mm">Bağlanılamadı. Worker adresini kontrol et.</div>';}
}
$('mb').onclick=loadM;
$('mf').addEventListener('input',renderM);
$('hf').addEventListener('change',renderM);
$('ho').addEventListener('change',renderM);
$('ml').addEventListener('click',e=>{
  const el=e.target.closest('.mi');if(!el)return;
  const m=MM.find(x=>String(x.id)===el.dataset.id);if(!m)return;
  $('nA').value=m.home;$('nB').value=m.away;
  if(m.odds){$('oA').value=m.odds.h;$('oB').value=m.odds.a;$('oD').value=m.odds.d||'';$('mn').textContent='';}
  else{$('oA').value='';$('oB').value='';$('oD').value='';$('mn').textContent='Bu maç için oran bulunamadı. Aşağıdaki kutulara oranları elle gir.';$('setup').scrollIntoView({behavior:'smooth'});refreshInfo();return;}
  refreshInfo();closeSheet();
});

refreshInfo();fit();
</script>
